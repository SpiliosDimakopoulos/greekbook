[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "greekbook"
dynamic = ["version"]
description = "Markdown to beautifully typeset Greek books and theses (PDF, PDF/A, EPUB) — no LaTeX required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/greekbook/fonts/LICENSES.txt"]
requires-python = ">=3.10"
authors = [{ name = "Spilios Dimakopoulos" }]
keywords = [
    "greek", "typesetting", "typst", "markdown", "pdf", "epub", "thesis",
    "book", "hyphenation", "typography", "ελληνικά",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: Greek",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = [
    "typst>=0.15,<0.16",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "PyYAML>=6.0",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pypdf>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "python-docx>=1.1",
    "Pillow>=10",
]

[project.scripts]
greekbook = "greekbook.cli:main"

[project.urls]
Homepage = "https://github.com/SpiliosDimakopoulos/greekbook"
Issues = "https://github.com/SpiliosDimakopoulos/greekbook/issues"
Changelog = "https://github.com/SpiliosDimakopoulos/greekbook/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/greekbook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/greekbook"]

[tool.hatch.build.targets.sdist]
include = ["src/greekbook", "tests", "README.md", "README.el.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]  # Greek text has look-alike letters

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/greekbook"]

[[tool.mypy.overrides]]
module = ["typst", "ebooklib", "ebooklib.*", "docx", "docx.*", "lxml", "lxml.*", "mdit_py_plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["greekbook"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
