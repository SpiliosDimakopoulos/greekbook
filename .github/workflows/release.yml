name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  standalone:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: greekbook-windows.exe
          - os: macos-latest
            asset: greekbook-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[docx]" pyinstaller
      - run: python packaging/build_exe.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/greekbook --version
          ./dist/greekbook doctor
          ./dist/greekbook new smoke -t thesis && ./dist/greekbook build smoke --pdfa
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/greekbook.exe "${{ matrix.asset }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -9 "../${{ matrix.asset }}" greekbook
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  github-release:
    needs: [build, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          greekbook new thesis -t thesis && greekbook build thesis --pdfa -o greekbook-sample-thesis.pdf
          greekbook new novel -t novel && greekbook build novel --epub -o greekbook-sample-novel.pdf
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          pattern: greekbook-*
          merge-multiple: true
          path: standalone/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            standalone/*
            greekbook-sample-thesis.pdf
            greekbook-sample-novel.pdf
            greekbook-sample-novel.epub

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/spiliosdimakopoulos/greekbook:latest
            ghcr.io/spiliosdimakopoulos/greekbook:${{ github.ref_name }}
